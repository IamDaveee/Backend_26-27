<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forum Post</title>
</head>
<body>
    <h1>Szaz Bence egy</h1>
    <h2>Regisztráció</h2>
    <form id="regform">
        <label for="id">Azonosító: </label>
        <input type="number" name="id" required>
        <br>
        <label for="veznev">Vezetéknév: </label>
        <input type="text" name="veznev" required>
        <br>
        <label for="utonev">Keresztnév: </label>
        <input type="text" name="utonev" required>
        <br>
        <label for="email">Email: </label>
        <input type="email" name="email" required>
        <br>
        <label for="utolso">Utolsó üzenet: </label>
        <input type="date" name="utolso" required>
        <br>
        <button type="submit">Regisztrálj!</button>
    </form>

    <script src="./js/script.js"></script>
</body>
</html>
