<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8">
    <title>Szállítás</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    
    <div id="container">
        <h1>Szállítás</h1>
        <form id="szallitasForm">
            <label for="nev">Név:</label>
            <input type="text" id="nev" name="nev" required>

            <label for="suly">Csomag súlya (kg):</label>
            <input type="number" id="suly" name="suly" required min="0.1" step="0.1">

            <p>Szállítási mód:</p>
            <div class="radio-group">
                <label><input type="radio" name="mod" value="Normál" required checked> Normál</label>
                <label><input type="radio" name="mod" value="Expressz"> Expressz</label>
                <label><input type="radio" name="mod" value="Éjszakai"> Éjszakai</label>
            </div>


            <button type="submit">Mentés</button>
        </form>

        <h2>Mentett szállítások</h2>
        <table id="adatok">
            <thead>
                <tr>
                    <th>Név</th>
                    <th>Súly (kg)</th>
                    <th>Szállítási mód</th>
                    <th>Ár (Ft)</th>
                    <th>Törlés</th>
                </tr>
            </thead>
            <tbody ></tbody>
        </table>
    </div>
    <script src="script.js"></script>
</body>

</html>
